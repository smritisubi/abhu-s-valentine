<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Pop-up Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="front">
            <p class="message">Open Me</p>
        </div>
        <div class="back">
            <p class="caption">The invisible string isn't so invisible after all, huh? Since you didn’t ask me to be your Valentine... face the consequences.</p>
            <div class="buttons">
                <button class="button" id="escapeButton">Escape</button>
                <button class="button" id="surrenderButton">I Surrender</button>
            </div>
            <div id="response" class="response"></div>
        </div>
    </div>
    <div id="fireworks" class="fireworks"></div>
    <div id="finalMessage" class="finalMessage"></div>

    <script src="script.js"></script>
</body>
</html>
